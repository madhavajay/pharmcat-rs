[workspace]
members = [
  "crates/pharmcat",
]
exclude = [
  "repos/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT"

[workspace.dependencies]
bitflags = "2.0.2"
bstr = { version = "1.9.0", default-features = false, features = ["std"] }
bytes = "1.10.0"
flate2 = { version = "1.1.0", default-features = false, features = ["zlib-rs"] }
futures = { version = "0.3.15", default-features = false }
indexmap = "2.0.0"
lexical-core = "1.0.0"
libdeflater = "1.19.0"
memchr = "2.3.3"
noodles-bgzf = { path = "repos/noodles/noodles-bgzf" }
noodles-core = { path = "repos/noodles/noodles-core" }
noodles-csi = { path = "repos/noodles/noodles-csi" }
noodles-tabix = { path = "repos/noodles/noodles-tabix" }
noodles-vcf = { path = "repos/noodles/noodles-vcf" }
percent-encoding = "2.1.0"
pin-project-lite = "0.2.6"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.145"
tokio = "1.10.0"
url = "2.2.2"

[workspace.lints.rust]
missing_docs = "warn"
